name: Build and publish E点通工具箱

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "版本标签：main 用 v2.0.0-alpha.132 等；dev 用 v2.0.0-dev.1 等"
        required: true
        type: string
      repair_published_dev:
        description: "仅修复已签名验收的 Dev 预发布更新清单，不重新打包"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release-channels
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.repair_published_dev != true }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check channel build configuration
        run: python tauri-app/scripts/test_release_channels.py

      - name: Validate channel and synchronize build identity
        id: channel
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: python tauri-app/scripts/prepare_channel_release.py

      - name: Refuse to replace an already published release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.RELEASE_TAG});
              if (!data.draft) throw new Error('该版本已发布，请使用新的版本标签。');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Check release isolation and frontend
        working-directory: tauri-app
        shell: pwsh
        run: |
          node --test scripts/publish_channel_release.check.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_import_case.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Run Rust tests
        working-directory: tauri-app
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify updater signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少仓库级 Actions Secret：TAURI_SIGNING_PRIVATE_KEY。'
          }

      - name: Build signed installer and updater artifacts as a draft
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        with:
          projectPath: tauri-app
          tagName: ${{ steps.channel.outputs.tag }}
          releaseCommitish: ${{ steps.channel.outputs.sha }}
          releaseName: E点通工具箱 ${{ steps.channel.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.channel == 'dev' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          tauriScript: npm run tauri --

      - name: Verify packaged native workers before publication
        working-directory: tauri-app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'src-tauri/target/release/audit-toolbox.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw '未找到本次打包的原生程序。' }
          python -X utf8 -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from build_tauri_release import smoke_test_desktop; smoke_test_desktop(Path(sys.argv[1]))" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/verify_ocr_workers.py --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/verify_meeting_media_workers.py --exe $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish to the selected update channel
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_SHA: ${{ steps.channel.outputs.sha }}
        with:
          script: |
            const publish = require('./tauri-app/scripts/publish_channel_release.cjs');
            await publish({github, context, fetch});

  repair_dev_channel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_published_dev == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev publishing tools
        uses: actions/checkout@v4

      - name: Test publishing tools
        run: node --test tauri-app/scripts/publish_channel_release.check.cjs

      - name: Validate Dev ref and restore its published update manifest
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHANNEL: dev
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            if (context.ref !== 'refs/heads/dev') throw new Error('仅允许从 dev 分支修复开发更新通道。');
            const publish = require('./tauri-app/scripts/publish_channel_release.cjs');
            await publish.repairDevChannel({github, context, fetch});
