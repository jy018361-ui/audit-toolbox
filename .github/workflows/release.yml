name: Build and publish E点通工具箱

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release channel and version
        id: release
        shell: pwsh
        run: python tauri-app/scripts/prepare_channel_release.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build installer and updater as a draft
        id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        with:
          projectPath: tauri-app
          tagName: ${{ steps.release.outputs.tag }}
          releaseCommitish: ${{ steps.release.outputs.sha }}
          releaseName: E点通工具箱 ${{ steps.release.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: ${{ steps.release.outputs.channel == 'dev' }}
          prerelease: ${{ steps.release.outputs.channel == 'dev' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          tauriScript: npm run tauri --

      - name: Publish release and sync Dev update channel
        if: steps.release.outputs.channel == 'dev'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const publish = require('./tauri-app/scripts/publish_channel_release.cjs');
            await publish({github, context, fetch});
