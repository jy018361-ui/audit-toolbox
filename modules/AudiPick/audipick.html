/* ===== Intro Animation ===== */
#intro{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all 0.8s ease-out;}
#intro.intro-gone{display:none!important;pointer-events:none!important;}
#intro canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
/* ===== End Intro ===== */
.spinner{border:3px solid #333;border-top:3px solid #FFCC00;border-radius:50%;width:20px;height:20px;animation:spin .8s linear infinite;display:inline-block;}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.btn{background:#FFCC00;color:#1A1A1A;border:none;cursor:pointer;transition:all .2s;font-weight:600;}
.btn:hover{background:#FFD633;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-sm{padding:6px 16px;border-radius:8px;font-size:13px;}
.btn-lg{padding:10px 24px;border-radius:10px;font-size:15px;}
.btn-outline{background:transparent;color:#ccc;border:1px solid #555;cursor:pointer;transition:all .2s;font-weight:500;}
.btn-outline:hover:not(:disabled){background:#2a2a2a;color:#fff;border-color:#777;}
.btn-outline:disabled{opacity:.45;cursor:not-allowed;color:#666;border-color:#444;}
.btn-sec{background:#333;color:#FFCC00;border:1px solid #FFCC00;}
.btn-sec:hover{background:#444;}
.ap-scroll{scrollbar-width:thin;scrollbar-color:#555 transparent;}
.ap-scroll::-webkit-scrollbar{width:6px;height:6px;}
.ap-scroll::-webkit-scrollbar-track{background:transparent;}
.ap-scroll::-webkit-scrollbar-thumb{background:#555;border-radius:3px;}
.ap-scroll::-webkit-scrollbar-thumb:hover{background:#777;}
#ap-shell ::-webkit-scrollbar{width:6px;height:6px;}
#ap-shell ::-webkit-scrollbar-track{background:transparent;}
#ap-shell ::-webkit-scrollbar-thumb{background:#555;border-radius:3px;}
#ap-shell ::-webkit-scrollbar-thumb:hover{background:#777;}
#ap-shell *{scrollbar-width:thin;scrollbar-color:#555 transparent;}
.ap-details{border:1px solid #333;border-radius:10px;background:#1a1a1a;}
.ap-details>summary{padding:12px 16px;font-size:13px;color:#999;cursor:pointer;list-style:none;user-select:none;}
.ap-details>summary::-webkit-details-marker{display:none;}
.ap-details>summary::before{content:'▸ ';color:#666;}
.ap-details[open]>summary::before{content:'▾ ';}
.ap-details>summary:hover{color:#ccc;}
.ap-details .ap-details-body{padding:0 16px 16px;border-top:1px solid #333;}
.work-row-active{background:#2a2200;box-shadow:inset 0 0 0 1px #FFCC00;}
#pdfContainer.pdf-flash{box-shadow:inset 0 0 0 3px rgba(255,204,0,0.5);transition:box-shadow .3s;}
.pdf-search-note{position:absolute;left:12px;right:12px;top:12px;background:rgba(26,26,26,.92);border:1px solid rgba(255,204,0,.8);color:#FFCC00;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.35);}
#taskControlBar.hidden{display:none!important;}
#splitHandle{touch-action:none;user-select:none;}
.ap-menu-wrap .hidden{display:none;}
.card{border:1px solid #444;border-radius:12px;background:#222;transition:box-shadow .2s;}
.card:hover{box-shadow:0 4px 16px rgba(255,204,0,.1);}
.dropzone{border:2px dashed #555;border-radius:12px;padding:28px;text-align:center;transition:all .2s;cursor:pointer;background:#1A1A1A;}
.dropzone:hover{border-color:#FFCC00;background:#252000;}
.dropzone.dragover{border-color:#FFCC00;background:#2A2200;}
input:focus,textarea:focus{outline:none;border-color:#FFCC00;box-shadow:0 0 0 3px rgba(255,204,0,.15);}
pre{white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:12px;background:#1A1A1A;padding:12px;border-radius:8px;max-height:300px;overflow:auto;border:1px solid #444;color:#ccc;}
.text-ey{color:#FFCC00;}
.bg-ey{background:#FFCC00;}
.bg-eydark{background:#1A1A1A;}
.border-ey{border-color:#FFCC00;}
.tab-active{background:#FFCC00;color:#1A1A1A;font-weight:600;}
.tab-inactive{background:#333;color:#999;}
.tab-inactive:hover{background:#444;color:#ccc;}
.radio-sel{border-color:#FFCC00;background:#2A2200;}
.radio-nor{border-color:#555;background:#1A1A1A;}

.theme-option:hover{border-color:var(--accent);background:var(--surface-muted);}
.theme-option-selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft);}
.theme-option-swatches{display:flex;height:42px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.16);}
.theme-swatch{flex:1;min-width:0;}
.theme-option-copy{min-width:0;display:block;}
.theme-option-copy strong{display:block;font-size:14px;color:var(--text);}
.theme-option-copy small{display:block;font-size:11px;color:var(--text-muted);margin-top:4px;white-space:normal;line-height:1.35;}
.theme-option-state{font-size:11px;color:var(--text-muted);white-space:nowrap;}
.theme-option-selected .theme-option-state{color:var(--accent-text);background:var(--accent);padding:3px 7px;border-radius:999px;font-weight:600;}
.theme-dialog-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-soft);}
.theme-dialog-foot p{font-size:11px;color:var(--text-muted);}

<script>
// ===== Intro Animation Logic =====
window.hideIntro=function(){
var intro=document.getElementById('intro');
if(intro){intro.classList.add('intro-gone');intro.style.pointerEvents='none';intro.style.display='none';intro.style.opacity='0';}
var app=document.getElementById('app');
if(app)app.style.opacity='1';
};
(function(){
    var lastIntro = localStorage.getItem('ap_last_intro');
    var now = Date.now();
    // 选项B：每天只播放一次 (24 * 60 * 60 * 1000 = 86400000ms)
    if(lastIntro && now - parseInt(lastIntro) < 86400000) {
        window.hideIntro();
        window.apPendingTour=!localStorage.getItem('ap_tour_done');
        return;
    }
    
    // 如果没有跳过，则设置本次播放时间
    localStorage.setItem('ap_last_intro', now.toString());

    var intro = document.getElementById('intro');
    var canvas = document.getElementById('introCanvas');
    var ctx = canvas.getContext('2d');
    var app = document.getElementById('app');
    var w, h, cx, cy;
    var fov = 300;
    var animationId;
    var introDone = false;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        cx = w / 2;
        cy = h / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    class Doc {
        constructor() { this.init(true); }
        init(randomZ) {
            this.x = (Math.random() - 0.5) * 8000;
            this.y = (Math.random() - 0.5) * 8000;
            this.z = randomZ ? Math.random() * 4000 + 500 : 4000;
            this.vz = -(Math.random() * 40 + 20);
            this.rot = Math.random() * Math.PI * 2;
            this.vrot = (Math.random() - 0.5) * 0.05;
        }
        update(phase) {
            if (phase === 1) {
                this.z += this.vz;
                this.vz *= 1.04; // 加速飞向镜头
                if (this.z < 10) this.init(false);
                this.rot += this.vrot;
            } else if (phase === 2) {
                // 坍缩
                this.x *= 0.75;
                this.y *= 0.75;
                this.z *= 0.75;
                this.rot += this.vrot * 15;
            }
        }
        draw() {
            if (this.z < 10) return;
            var scale = fov / (fov + this.z);
            var px = cx + this.x * scale;
            var py = cy + this.y * scale;
            
            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(this.rot);
            ctx.scale(scale, scale);
            
            // 画文档面片
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.strokeStyle = 'rgba(255, 204, 0, 0.3)';
            ctx.lineWidth = 3;
            ctx.fillRect(-60, -80, 120, 160);
            ctx.strokeRect(-60, -80, 120, 160);
            
            // 画文字线条
            ctx.fillStyle = 'rgba(255, 204, 0, 0.4)';
            for(var i=0; i<5; i++) {
                ctx.fillRect(-40, -50 + i*20, 80 - Math.random()*40, 6);
            }
            ctx.restore();
        }
    }

    class DataPoint {
        constructor() {
            this.x = cx + (Math.random() - 0.5) * 150;
            this.y = cy + (Math.random() - 0.5) * 150;
            this.vx = (Math.random() - 0.5) * 80;
            this.vy = (Math.random() - 0.5) * 80;
            this.life = 1;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.85;
            this.vy *= 0.85;
            this.life -= 0.03;
        }
        draw() {
            ctx.fillStyle = 'rgba(255, 204, 0, ' + this.life + ')';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
            ctx.fill();
        }
    }

    var docs = [];
    for(var i=0; i<250; i++) docs.push(new Doc());
    var points = [];
    var shockwave = { r: 0, active: false, opacity: 1 };
    var startTime = Date.now();

    function animate() {
        if(introDone) return;
        var elapsed = Date.now() - startTime;
        
        // 拖尾效果
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(0, 0, w, h);
        
        var phase = 1;
        if (elapsed > 1800) phase = 2; // 1.8s开始坍缩
        if (elapsed > 2400) phase = 3; // 2.4s爆发
        
        if (phase === 1 || phase === 2) {
            for(var i=0; i<docs.length; i++) {
                docs[i].update(phase);
                docs[i].draw();
            }
        }
        
        if (phase === 2) {
            for(var j=0; j<20; j++) points.push(new DataPoint());
        }
        
        if (phase >= 2) {
            for(var k=0; k<points.length; k++) {
                points[k].update();
                points[k].draw();
            }
            points = points.filter(function(p){ return p.life > 0; });
        }
        
        if (phase === 3 && !shockwave.active) {
            shockwave.active = true;
            document.getElementById('intro-icon').style.opacity = '1';
            document.getElementById('intro-icon').style.transform = 'scale(1)';
            document.getElementById('intro-title').style.opacity = '1';
            document.getElementById('intro-title').style.transform = 'translateY(0)';
            document.getElementById('intro-sub').style.opacity = '1';
            document.getElementById('intro-sub').style.transform = 'translateY(0)';
            document.getElementById('intro-btn').style.opacity = '1';
            document.getElementById('intro-btn').style.transform = 'translateY(0)';
            
            // 冲击波点亮背景
            intro.style.background = 'radial-gradient(circle at center, #2a1f00 0%, #000 80%)';
        }
        
        if (shockwave.active) {
            shockwave.r += 80;
            shockwave.opacity -= 0.03;
            if (shockwave.opacity > 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, shockwave.r, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255, 204, 0, ' + shockwave.opacity + ')';
                ctx.lineWidth = 20;
                ctx.stroke();
            }
        }
        
        animationId = requestAnimationFrame(animate);
    }

    animate();

    window.endIntroBtn = function(e) {
        if(e) e.stopPropagation();
        if(introDone) return;
        introDone = true;
        cancelAnimationFrame(animationId);
        window.hideIntro();
        if(!localStorage.getItem('ap_tour_done')) {
            if(typeof nav==='function' && typeof page!=='undefined' && page!=='dash') nav('dash');
            setTimeout(function(){ if(window.startTour) window.startTour(); }, 150);
        }
    };
    
    // 点击背景也可以跳过
    intro.addEventListener('click', function(e){
        if(e.target.id !== 'intro-btn') window.endIntroBtn();
    });
})();
// ===== Intro Animation Logic End =====

// ===== Tour Guide Logic =====
window.startTour = function() {
    if(document.getElementById('tour-overlay')) return;
    
    // 确保在工作台页面，否则找不到对应元素
    if(page !== 'dash') {
        nav('dash');
        // 如果进行了页面跳转，需要等待渲染完成再执行后续逻辑
        setTimeout(window.startTour, 100);
        return;
    }
    
    var steps = [
        { el: 'nav-cfg', title: '第一步：配置 AI 接口 🔑', desc: 'AudiPick 依赖大模型进行智能提取。请先进入配置页面，填写您的 API Key。' },
        { el: 'btn-new-proj', title: '第二步：新建审计项目 📁', desc: '配置完成后，在这里创建一个新项目，用于归档和管理您的合同文件。' },
        { el: 'nav-dash', title: '第三步：上传与提取 🤖', desc: '进入项目后，拖拽上传 PDF 合同，系统会自动进行 OCR 识别和 AI 条款提取，最后可一键导出 Excel 底稿！' }
    ];
    
    var currentStep = 0;
    var overlay = document.createElement('div');
    overlay.id = 'tour-overlay';
    var tooltip = document.createElement('div');
    tooltip.id = 'tour-tooltip';
    
    document.body.appendChild(overlay);
    document.body.appendChild(tooltip);
    
    function showStep() {
        var step = steps[currentStep];
        var target = document.getElementById(step.el);
        if(!target) {
            endTour();
            return;
        }
        
        var rect = target.getBoundingClientRect();
        
        // 设置遮罩层（高亮目标）
        overlay.style.top = (rect.top - 4) + 'px';
        overlay.style.left = (rect.left - 4) + 'px';
        overlay.style.width = (rect.width + 8) + 'px';
        overlay.style.height = (rect.height + 8) + 'px';
        
        // 设置提示框内容
        var isLast = currentStep === steps.length - 1;
        tooltip.innerHTML = '<h3 class="text-lg font-bold text-ey mb-2">' + step.title + '</h3><p class="text-sm text-gray-300 mb-4 leading-relaxed">' + step.desc + '</p><div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-700"><span class="text-xs text-gray-500">' + (currentStep + 1) + ' / ' + steps.length + '</span><div class="flex gap-2"><button onclick="endTour()" class="text-xs text-gray-400 hover:text-white px-2 py-1">跳过</button><button onclick="nextTourStep()" class="bg-ey text-eydark px-3 py-1.5 rounded text-xs font-bold hover:bg-yellow-400 transition-colors">' + (isLast ? '完成体验' : '下一步') + '</button></div></div>';
        
        // 计算提示框位置 (尽量放在目标右侧或下方)
        var tooltipTop = rect.top;
        var tooltipLeft = rect.right + 20;
        
        if(tooltipLeft + 320 > window.innerWidth) {
            // 如果右侧放不下，放到下方
            tooltipTop = rect.bottom + 20;
            // 默认与目标左对齐
            tooltipLeft = rect.left;
            // 如果左对齐还是会超出右侧屏幕，则靠右对齐（距离屏幕边缘20px）
            if (tooltipLeft + 320 > window.innerWidth) {
                tooltipLeft = window.innerWidth - 320 - 20;
            }
        }
        
        tooltip.style.top = tooltipTop + 'px';
        tooltip.style.left = tooltipLeft + 'px';
    }
    
    window.nextTourStep = function() {
        currentStep++;
        if(currentStep >= steps.length) endTour();
        else showStep();
    };
    
    window.endTour = function() {
        localStorage.setItem('ap_tour_done', 'true');
        if(overlay) overlay.remove();
        if(tooltip) tooltip.remove();
    };
    
    // 延迟一点显示，确保DOM渲染完毕
    setTimeout(showStep, 500);
};

</script>

<script>
var PDFJS_CFG=(window.desktop&&window.desktop.pdfjs)||null;
pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CFG?PDFJS_CFG.workerSrc:'vendor/pdfjs/legacy/build/pdf.worker.min.js';
function getPdfDocumentOptions(data){
var cfg=PDFJS_CFG||{cMapUrl:'vendor/pdfjs/cmaps/',standardFontDataUrl:'vendor/pdfjs/standard_fonts/'};
return{
data:data,
cMapUrl:cfg.cMapUrl,
cMapPacked:true,
standardFontDataUrl:cfg.standardFontDataUrl,
useSystemFonts:true
};
}
if(typeof refreshRulePresets==='function')refreshRulePresets();

let page='home',pid='',cid='';
let activeRuleId='loan_covenant';
let batchRuleId='loan_covenant';
let rulesViewId='loan_covenant';
let templateTab='all';
let templateSearch='';
let selectedWorkRowId=null;
let activeFieldSetId=null;
let workFilterText='';
let editingCustomId=null;
let pendingExtractOpts=null;
let CUSTOM_RULES=[];
let P=JSON.parse(localStorage.getItem('ap_p')||'[]');
let Ct=JSON.parse(localStorage.getItem('ap_c')||'[]');
let V=JSON.parse(localStorage.getItem('ap_v')||'[]');
let A=JSON.parse(localStorage.getItem('ap_k')||'{}');
let O=JSON.parse(localStorage.getItem('ap_ocr')||JSON.stringify({engine:'ai'}));
let workLog=JSON.parse(localStorage.getItem('ap_log')||'[]');
let extractCache=JSON.parse(localStorage.getItem('ap_cache')||'{}');
let logCollapsed=true;
const BATCH_CONCURRENCY=3;
var TASK_STOPPED='TASK_STOPPED';
var taskRunner={
active:false,type:'',label:'',detail:'',progress:'',paused:false,stopped:false,abortCtrl:null,_total:0,_done:0,
start:function(type,label,total){
if(this.active&&this.abortCtrl){try{this.abortCtrl.abort();}catch(e){}}
this.active=true;this.type=type;this.label=label;this.detail='';this.progress=total?( '0/'+total):'';this.paused=false;this.stopped=false;this.abortCtrl=new AbortController();this._total=total||0;this._done=0;renderTaskBar();
},
update:function(detail,progress){
if(detail!==undefined)this.detail=detail;
if(progress!==undefined)this.progress=progress;
renderTaskBar();
},
tick:function(n){
this._done=(this._done||0)+(n||1);
if(this._total)this.progress=this._done+'/'+this._total;
renderTaskBar();
},
finish:function(msg,progress){
this.active=false;this.paused=false;this.stopped=false;this.abortCtrl=null;
if(msg)this.detail=msg;
if(progress!==undefined)this.progress=progress;
renderTaskBar();
var self=this;
setTimeout(function(){if(!self.active)hideTaskBar();},4500);
},
pause:function(){if(!this.active||this.stopped)return;this.paused=true;renderTaskBar();},
resume:function(){if(!this.active||this.stopped)return;this.paused=false;renderTaskBar();},
stop:function(){if(!this.active)return;this.stopped=true;this.paused=false;if(this.abortCtrl){try{this.abortCtrl.abort();}catch(e){}}renderTaskBar();},
getSignal:function(){return this.abortCtrl?this.abortCtrl.signal:null;},
isStopped:function(){return !!this.stopped;},
async checkpoint(){if(this.stopped)throw new Error(TASK_STOPPED);while(this.paused&&!this.stopped){renderTaskBar();await new Promise(function(r){setTimeout(r,250);});}if(this.stopped)throw new Error(TASK_STOPPED);}
};
window.taskRunner=taskRunner;
window.taskPause=function(){taskRunner.pause();};
window.taskResume=function(){taskRunner.resume();};
window.taskStop=function(){taskRunner.stop();};
function taskTypeLabel(t){if(t==='upload')return '上传/OCR';if(t==='extract')return 'AI提取';if(t==='batch')return '批量提取';return '任务';}
function renderTaskBar(){
var bar=document.getElementById('taskControlBar');if(!bar)return;
if(!taskRunner.active){bar.className='hidden';return;}
bar.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] w-[min(640px,calc(100vw-2rem))]';
var stateLabel=taskRunner.stopped?'正在停止…':taskRunner.paused?'已暂停':'运行中';
var stateCls=taskRunner.stopped?'text-amber-400':taskRunner.paused?'text-blue-400':'text-emerald-400';
bar.innerHTML='<div class="bg-gray-900 border border-gray-700 rounded-xl shadow-2xl px-4 py-3 flex items-center gap-3">'+
'<span class="spinner shrink-0"></span>'+
'<div class="flex-1 min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="text-xs font-semibold text-ey">'+escapeHtml(taskTypeLabel(taskRunner.type))+'</span><span class="text-xs '+stateCls+'">'+stateLabel+'</span>'+(taskRunner.progress?'<span class="text-xs text-gray-500">'+escapeHtml(String(taskRunner.progress))+'</span>':'')+'</div>'+
'<p class="text-xs text-white truncate mt-0.5" title="'+escapeHtml(taskRunner.detail||taskRunner.label)+'">'+escapeHtml(taskRunner.detail||taskRunner.label)+'</p></div>'+
'<div class="flex gap-1.5 shrink-0">'+
(taskRunner.paused&&!taskRunner.stopped?'<button type="button" onclick="taskResume()" class="btn btn-sm text-xs px-3 py-1.5">继续</button>':'<button type="button" onclick="taskPause()" class="btn-sec btn-sm text-xs px-3 py-1.5"'+(taskRunner.stopped?' disabled':'')+'>暂停</button>')+
'<button type="button" onclick="taskStop()" class="text-xs px-3 py-1.5 rounded-lg border border-red-800 text-red-400 hover:bg-red-900/40"'+(taskRunner.stopped?' disabled':'')+'>停止</button></div></div>';
}
function hideTaskBar(){var bar=document.getElementById('taskControlBar');if(bar)bar.className='hidden';}
function isTaskStoppedErr(e){return e&&(e.message===TASK_STOPPED||(e.name==='AbortError'&&taskRunner.stopped));}
function bindTaskAbort(ctrl){var sig=taskRunner.getSignal();if(!sig||!ctrl)return; if(sig.aborted){try{ctrl.abort();}catch(e){}}else{sig.addEventListener('abort',function(){try{ctrl.abort();}catch(e){}});}}
const DB_NAME='AudiPickDB';let db;
function initDB(){
    return new Promise(function(resolve,reject){
        var req=indexedDB.open(DB_NAME,2);
        req.onupgradeneeded=function(e){
            var d=e.target.result;
            if(!d.objectStoreNames.contains('store'))d.createObjectStore('store');
            if(!d.objectStoreNames.contains('pdfs'))d.createObjectStore('pdfs');
        };
        req.onsuccess=function(e){db=e.target.result;resolve();};
        req.onerror=function(e){reject(e);};
    });
}
function dbGet(k){return new Promise(function(resolve){var tx=db.transaction('store','readonly');var req=tx.objectStore('store').get(k);req.onsuccess=function(e){resolve(e.target.result);};req.onerror=function(){resolve(null);};});}
function dbPut(k,v){return new Promise(function(resolve){var tx=db.transaction('store','readwrite');tx.objectStore('store').put(v,k);tx.oncomplete=function(){resolve();};});}
function dbPutPdf(k,v){return new Promise(function(resolve){var tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(v,k);tx.oncomplete=function(){resolve();};});}
function dbGetPdf(k){return new Promise(function(resolve){var tx=db.transaction('pdfs','readonly');var req=tx.objectStore('pdfs').get(k);req.onsuccess=function(e){resolve(e.target.result);};req.onerror=function(){resolve(null);};});}
function dbDeletePdf(k){return new Promise(function(resolve){if(!db)return resolve();try{var tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').delete(k);tx.oncomplete=function(){resolve();};tx.onerror=function(){resolve();};}catch(e){resolve();}});}
function save(){
    dbPut('ap_p',P);dbPut('ap_c',Ct);dbPut('ap_v',V);dbPut('ap_k',A);dbPut('ap_ocr',O);dbPut('ap_custom_rules',CUSTOM_RULES);dbPut('ap_cache',extractCache);RuleEngine.setCustomRules(CUSTOM_RULES);if(typeof refreshRulePresets==='function')refreshRulePresets();
}
async function loadData(){
    await initDB();
    var m=await dbGet('migrated');
    if(!m){
        await dbPut('migrated',true);

// 按路径从响应里提取文本。支持: a.b.c / arr[].field / arr
function extractTextByPath(obj,path){
if(!path)return typeof obj==='string'?obj:(obj&&obj.text?obj.text:'');
path=path.trim();
if(path.indexOf('[]')>=0){
var parts=path.split('[]');
var before=parts[0].replace(/^\./,'');
var after=(parts[1]||'').replace(/^\./,'');
var arr=obj;
if(before){before.split('.').forEach(function(k){if(arr)arr=arr[k];});}
if(!Array.isArray(arr))return '';
return arr.map(function(it){var v=it;if(after){after.split('.').forEach(function(k){if(v)v=v[k];});}return v===null||v===undefined?'':String(v);}).filter(function(s){return s;}).join('\n');
}
var cur=obj;
path.split('.').forEach(function(k){if(cur)cur=cur[k];});
if(cur===null||cur===undefined)return '';
if(Array.isArray(cur))return cur.map(function(x){return String(x);}).join('\n');
return String(cur);
}

function parseStructuredArray(content,arrayKeys){

  var jsonText=cleanStructuredJson(objectMatch?objectMatch[0]:source);
  var attempts=[jsonText,jsonText.replace(/}\s*{/g,'},{')];
  for(var a=0;a<attempts.length;a++){
    try{
      var parsed=JSON.parse(attempts[a]);
      for(var k=0;k<(arrayKeys||[]).length;k++){
        if(Array.isArray(parsed[arrayKeys[k]]))return parsed[arrayKeys[k]];
      }
      if(Array.isArray(parsed))return parsed;
      if(parsed&&typeof parsed==='object'&&Object.keys(parsed).length)return [parsed];
    }catch(ignore){}
  }

      if(escaped)escaped=false;
      else if(ch==='\\')escaped=true;
      else if(ch==='"')inString=false;
      continue;
    }
    if(ch==='"'){inString=true;continue;}
    if(ch==='{'){if(depth===0)start=i;depth++;continue;}
    if(ch==='}'&&depth>0){
      depth--;
      if(depth===0&&start>=0){

function fmtPage(v){
  var s=toStr(v).trim();
  if(!s)return '【页码未知】';
  if(/^【.*】$/.test(s))return s;
  var nums=s.match(/\d+/g);
  if(nums&&nums.length){
    nums=nums.map(function(n){return parseInt(n,10);}).sort(function(a,b){return a-b;});
    if(nums.length===1)return '【第'+nums[0]+'页】';
    return '【第'+nums[0]+'-'+nums[nums.length-1]+'页】';
  }
  if(/第.*页/.test(s))return '【'+s+'】';
  return '【页码未知】';
}

function normalizeItem(x,ruleId,fieldKeys){
  ruleId=ruleId||activeRuleId;
  var item={id:gid(),contractId:'',ruleId:ruleId,ruleVersion:(RuleEngine.getRule(ruleId)||{}).version||'1.0'};
  var fs=fieldKeys&&fieldKeys.length?FieldSet.fieldsForKeys(ruleId,fieldKeys):getFields(ruleId);
  var pk=pageKey(ruleId);
  fs.forEach(function(f){
    var v=null;
    if(Object.prototype.hasOwnProperty.call(x,f.key))v=x[f.key];
    else{
      var lk=f.key.toLowerCase().replace(/[\s\-_]/g,'');
      Object.keys(x).some(function(k){if(k.toLowerCase().replace(/[\s\-_]/g,'')===lk){v=x[k];return true;}return false;});
    }
    item[f.key]=(f.key===pk)?fmtPage(v):toStr(v);
  });
  if(pk&&!item[pk])item[pk]='【页码未知】';
  return item;
}
function parseStructuredItems(content){
  return parseStructuredArray(content,['items','covenants','results','data']);
}
function consolidateRevenueWorkpaperResults(items,statusCb,cid,ruleId,fieldKeys,strictMode){
  if(ruleId!=='revenue_workpaper'||!window.RevenueWorkpaper)return Promise.resolve(items||[]);
  var candidates=RevenueWorkpaper.normalizeResults(items||[]);
  if(!candidates.length)return Promise.resolve([]);
  if(statusCb)statusCb({msg:'深度复核中：正在合并重复项和冲突结论...',progress:15});
  var fs=FieldSet.fieldsForKeys(ruleId,fieldKeys);
  var keyList=fs.map(function(f){return f.key;});
  var compact=candidates.map(function(item){
    var out={};
    keyList.forEach(function(key){
      var val=String(item[key]||'');
      out[key]=val.length>2400?val.substring(0,2400):val;
    });
    return out;
  });
  var sample='{'+keyList.map(function(k){return '"'+k+'":""';}).join(',')+'}';
  var sharedFacts=(cid&&gc(cid)&&gc(cid).revenueFacts)||[];
  var prompt='以下是同一份收入合同逐段提取出的候选底稿结果。请进行整合同汇总复核：\n'+
    '1. 合并同一工作表、同一底稿行的问题，只保留证据最完整的一条；前后冲突时不得擅自选边，应降低置信度并标记需人工复核。\n'+
    '2. 只依据候选项中的合同原文摘录，不得新增原文中没有的事实、数字或页码。\n'+
    '3. 合同未写不等于“否”；缺少合同外资料时，明确填写missing_information和fill_readiness。\n'+
    '4. 严格执行以下SOP口径：\n'+(window.REVENUE_WORKPAPER_SOP_GUIDE||'')+'\n\n'+
    '共享合同事实表（所有问题必须共同使用，不得与之矛盾）：\n'+JSON.stringify({facts:sharedFacts})+'\n\n候选结果：\n'+JSON.stringify({items:compact})+'\n\n'+
    '只输出JSON：{"items":['+sample+']}。每个对象必须且只能包含这些字段：'+keyList.join(', ')+'；所有值必须是字符串。';
  var ctrl=new AbortController();bindTaskAbort(ctrl);var timer=setTimeout(function(){ctrl.abort();},180000);
  var body={model:A.m||'gpt-4',messages:[
    {role:'system',content:'你是收入合同审阅结果复核助手。严格区分合同事实、SOP判断和缺失资料，只输出JSON。'},
    {role:'user',content:prompt}
  ],temperature:0,max_tokens:10000};
  applyJsonResponseMode(body,A.u);
  if(!A.think)body.enable_thinking=false;
  return taskRunner.checkpoint().then(function(){
    return safeFetch(chatCompletionsUrl(A.u),{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+A.k},body:JSON.stringify(body)});
  }).then(function(r){
    clearTimeout(timer);
    if(!r.ok)return r.text().then(function(e){throw new Error('API('+r.status+'):'+e.substring(0,300));});
    return r.json();
  }).then(function(d){
    var msg=d.choices&&d.choices[0]&&d.choices[0].message;
    var content=msg&&msg.content;
    if(!content||!content.trim())throw new Error('SOP汇总复核返回空');
    var arr=parseStructuredItems(content);
    var normalized=arr.filter(function(x){return x&&typeof x==='object';}).map(function(x){return normalizeItem(x,ruleId,fieldKeys);});
    if(!normalized.length)throw new Error('SOP汇总复核未返回有效结果');
    var finalItems=RevenueWorkpaper.normalizeResults(normalized);
    if(RevenueWorkpaper.applySharedFacts)finalItems=RevenueWorkpaper.applySharedFacts(finalItems,sharedFacts);
    if(statusCb)statusCb({msg:'深度复核完成',progress:100});
    return finalItems;
  }).catch(function(err){
    clearTimeout(timer);
    if(isTaskStoppedErr(err)||taskRunner.isStopped())throw err;
    if(strictMode)throw err;
    console.warn('SOP汇总复核失败，保留首轮结果:',err);

}

function aiExtractChunk(text,statusCb,cid,retries,ruleId,fieldKeys,promptOverride){
if(retries===undefined)retries=3;
ruleId=ruleId||activeRuleId;
fieldKeys=FieldSet.ensurePageInKeys(ruleId,fieldKeys||FieldSet.defaultFieldKeys(ruleId));
resetFields(ruleId);
var fs=FieldSet.fieldsForKeys(ruleId,fieldKeys);
var keyList=fs.map(function(f){return f.key;});
// 拼接合同文本：用户提示词含 {{TEXT}} 则替换，否则系统自动追加（用户无需手写占位符）
var prompt=FieldSet.filterPromptByFields(promptOverride||RuleEngine.getRulePrompt(ruleId),keyList);
var ruleMeta=RuleEngine.getRule(ruleId)||{};
var isTable=ruleMeta.docKind==='table';
if(String(text||'').indexOf('【资料包文件')>=0){
  prompt+='\n\n【关联资料分析规则】以下文本来自用户手动关联的同一资料包。必须联合分析，并保留文件边界；补充协议明确修改主文件条款时以补充协议为准，框架协议与订单应结合判断。不得把不同文件的原文、数字或页码拼成一条虚构条款。输出字段如支持来源文件，应写明实际文件名。';
}
if(prompt.indexOf('{{TEXT}}')>=0){prompt=prompt.replace('{{TEXT}}',text);}
else{prompt=prompt+'\n\n'+(isTable?'文档文本（OCR识别结果）':'合同文本')+'：\n'+text;}
// 动态 schema 锁：按用户勾选的字段名强制输出结构
var sample='{'+keyList.map(function(k){return '"'+k+'":""';}).join(',')+'}';
var schemaLock='\n\n【强制输出格式 - 最高优先级，必须严格遵守】\n你只能输出如下结构的JSON：\n{"items":['+sample+']}\n硬性要求：\n1. 每个对象的键名必须是且只能是：'+keyList.join(', ')+'，缺一不可，顺序不变。\n2. 不得使用任何其他字段名（无论英文或中文）。\n3. 布尔值用"是"/"否"字符串；所有值必须是字符串。\n4. 只输出JSON，不要markdown代码块，不要任何解释文字。';
prompt=prompt+schemaLock;
if(statusCb)statusCb('AI提取中...');
var ctrl=new AbortController();bindTaskAbort(ctrl);var t=setTimeout(function(){ctrl.abort();},120000);
var sysMsg=(isTable?'你是审计专用的单据结构化摘录助手。':'你是审计专用的合同条款精准摘录助手。')+'只输出JSON，用 {"items":[...]} 包装，每个对象的键名必须为：'+keyList.join(', ')+'，禁止使用任何其他字段名，不要任何解释。';
var body={model:A.m||'gpt-4',messages:[{role:'system',content:sysMsg},{role:'user',content:prompt}],temperature:0.1,max_tokens:8000};
applyJsonResponseMode(body,A.u);
if(!A.think){body.enable_thinking=false;}
return safeFetch(chatCompletionsUrl(A.u),{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+A.k},body:JSON.stringify(body)}).then(function(r){clearTimeout(t);if(!r.ok)return r.text().then(function(e){throw new Error('API('+r.status+'):'+e.substring(0,300));});return r.json();}).then(function(d){
var msg=d.choices&&d.choices[0]&&d.choices[0].message;
var c=msg&&msg.content;
if(!c||!c.trim()){
var rc=msg&&msg.reasoning_content;
if(rc&&rc.length>0)throw new Error('content为空(思维链占用'+rc.length+'字token,请在配置中关闭思维链)');
throw new Error('返回空');
}
try{var arr=parseStructuredItems(c);}
catch(pe){console.error('JSON fail:',pe,'raw:',c.substring(0,500));throw new Error('底稿答案JSON解析失败:'+pe.message);}
console.log('字段定义 fields:',keyList,'模型返回第一条键:',arr[0]?Object.keys(arr[0]):'');
var normalized=arr.filter(function(x){return x&&typeof x==='object';}).map(function(x){return normalizeItem(x,ruleId,fieldKeys);});
if(normalized.length===0)throw new Error('模型未返回任何底稿条目');
// 诊断：统计有效条数（至少有一个字段非空）
var validCount=normalized.filter(function(it){return fs.some(function(f){return it[f.key]&&String(it[f.key]).trim();});}).length;
if(normalized.length>0&&validCount===0){
window.__lastRawExtract=c.substring(0,3000);
var firstKeys=arr[0]?Object.keys(arr[0]).join('、'):'(无)';
console.warn('提取到'+normalized.length+'条但全部字段为空。模型键名:['+firstKeys+'] 期望字段:['+keyList.join(', ')+'] 原始返回:',window.__lastRawExtract);
throw new Error('字段名未匹配。模型用的键:['+firstKeys.substring(0,80)+']。详情见控制台 window.__lastRawExtract');
}
return normalized;
}).catch(function(e){
clearTimeout(t);
if(isTaskStoppedErr(e))throw e;
if(retries>0&&!taskRunner.isStopped()){
if(statusCb)statusCb('失败重试中...剩余'+retries+'次');
return new Promise(function(resolve){setTimeout(resolve,2000);}).then(function(){return aiExtractChunk(text,statusCb,cid,retries-1,ruleId,fieldKeys,promptOverride);});
}
if(e.name==='AbortError'){if(taskRunner.isStopped())throw new Error(TASK_STOPPED);throw new Error('超时');}throw e;
});
}

var MIN_PAGE_TEXT=60; // 单页文字层低于此字数则对该页做OCR（避免扫描件仅前几页有杂散文字就跳过OCR）
async function processPDF(file,onProgress,fileId){
await taskRunner.checkpoint();
var fid=fileId||file.name+'_'+Date.now();
var fsize=(file.size/1024).toFixed(0)+'KB';
addLog(fid,file.name,'文件上传成功','大小:'+fsize+' | 开始处理','done');
var typedArray=await file.arrayBuffer();
var pdf=await pdfjsLib.getDocument(getPdfDocumentOptions(typedArray)).promise;
var numPages=pdf.numPages;
addLog(fid,file.name,'解析PDF','共'+numPages+'页','done');
onProgress('分析PDF文字层...');
var pageTexts=[];
for(var pi=1;pi<=numPages;pi++){
await taskRunner.checkpoint();
var page=await pdf.getPage(pi);
var tc=await page.getTextContent();
pageTexts[pi]=tc.items.map(function(it){return it.str;}).join(' ').replace(/\s+/g,' ').trim();
}
var ocrPages=[];
for(var pi2=1;pi2<=numPages;pi2++){if((pageTexts[pi2]||'').length<MIN_PAGE_TEXT)ocrPages.push(pi2);}
var needOcr=ocrPages.length>0;
if(!needOcr){
var parts=[];
for(var pi3=1;pi3<=numPages;pi3++){
parts.push('---PDF第'+pi3+'页---\n'+(pageTexts[pi3]||''));
}
var pureText=parts.join('\n\n');
addLog(fid,file.name,'文字PDF提取完成','共'+pureText.length+'字 | 全部'+numPages+'页有文字层','done');
onProgress('文字PDF('+pureText.length+'字)');
return{text:pureText,isScanned:false,pagesMap:{}};
}
var engine=O.engine||'ai';
if(engine==='ai'&&!visionOk()){addLog(fid,file.name,'❌ 处理失败','未配置视觉模型API','error');throw new Error('请先在OCR引擎页配置视觉模型API');}
if(engine==='tesseract'&&typeof Tesseract==='undefined'){addLog(fid,file.name,'❌ Tesseract未加载','请检查网络','error');throw new Error('Tesseract.js未加载');}
if(engine==='custom'&&!(O.custom&&O.custom.url)){addLog(fid,file.name,'❌ 处理失败','未配置自定义OCR接口','error');throw new Error('请先配置自定义OCR接口');}
if(ocrPages.length===numPages){
addLog(fid,file.name,'扫描件识别开始','使用'+getOCRLabel()+'，共'+numPages+'页','warn');
}else{
addLog(fid,file.name,'混合PDF识别',''+ocrPages.length+'/'+numPages+'页需OCR，其余页用文字层','warn');
}
var allTexts=[];
var pagesMap={};
var ocrStart=Date.now();
for(var i=1;i<=numPages;i++){
await taskRunner.checkpoint();
var body=pageTexts[i]||'';
if(ocrPages.indexOf(i)>=0){
onProgress('OCR第'+i+'/'+numPages+'页...');
addLog(fid,file.name,'OCR识别中','正在识别第'+i+'页 / 共'+numPages+'页','info');
var b64=await pdfPageToImage(pdf,i,1.5);
try{
body=await runOCR(b64,i,numPages,onProgress);
addLog(fid,file.name,'OCR识别中','第'+i+'/'+numPages+'页 OK('+body.length+'字)','info');
}catch(e){
if(isTaskStoppedErr(e))throw e;
console.error('第'+i+'页OCR失败:',e);
addLog(fid,file.name,'第'+i+'页识别失败',e.message.substring(0,40),'error');
onProgress('第'+i+'页失败:'+e.message.substring(0,40));
body=body||pageTexts[i]||'';
}
}else{
onProgress('文字层第'+i+'/'+numPages+'页('+body.length+'字)');
}
if(body&&body.trim()){
allTexts.push('---PDF第'+i+'页---\n'+body);
pagesMap[i]=body.length;
}
}
var ocrElapsed=((Date.now()-ocrStart)/1000).toFixed(1);
var fullText=allTexts.join('\n');
if(fullText&&fullText.trim().length>50){
addLog(fid,file.name,'识别完成','耗时'+ocrElapsed+'秒 | 共'+fullText.length+'字 | OCR'+ocrPages.length+'页','done');
onProgress(getOCRLabel()+'完成('+fullText.length+'字)');
return{text:fullText,isScanned:true,pagesMap:pagesMap};
}
addLog(fid,file.name,'❌ 未能识别到文字','请检查PDF是否有效','error');
throw new Error('未能识别到文字');
}

let currentPdfDoc = null;
let currentPdfSourceId = null;
let currentPdfPage = 1;
let pdfScale = 1.5;
let pdfRotation = 0;
let pdfFitWidth = false;
let pdfSearchMatches = [];
let pdfSearchCursor = -1;
let pdfSearchQuery = '';
let pdfPaneOpen = false;

function parsePageNumber(pageStr) {
    if(pageStr === null || pageStr === undefined) return null;
    var s = String(pageStr).trim();
    if(!s) return null;
    var m = s.match(/第(\d+)(?:\s*[-~～]\s*\d+)?页/);
    if(m && m[1]) return parseInt(m[1], 10);
    var n = parseInt(s, 10);
    return isNaN(n) ? null : n;
}

function buildPageMarkers(text) {
    var markers = [];
    if(!text) return markers;
    var re = /---PDF第(\d+)页---/g;
    var m;
    while((m = re.exec(text)) !== null) {
        markers.push({ page: parseInt(m[1], 10), start: m.index });
    }
    return markers;
}

function pageNumAtTextIndex(text, index) {
    var markers = buildPageMarkers(text);
    if(!markers.length) return 1;
    var page = 1;
    for(var i = 0; i < markers.length; i++) {
        if(index >= markers[i].start) page = markers[i].page;
        else break;
    }
    return page;
}

function findTextMatches(text, query) {
    if(!text || !query) return [];
    var lower = text.toLowerCase();
    var ql = query.toLowerCase();
    var out = [];
    var pos = 0;
    while((pos = lower.indexOf(ql, pos)) !== -1) {
        out.push({ index: pos, page: pageNumAtTextIndex(text, pos) });
        pos += ql.length;
    }
    return out;
}

function updatePdfSearchStatus() {
    var el = document.getElementById('pdfSearchStatus');
    if(!el) return;
    if(!pdfSearchQuery || pdfSearchMatches.length === 0) {
        el.textContent = pdfSearchQuery ? '未找到' : '';
        return;
    }
    el.textContent = (pdfSearchCursor + 1) + '/' + pdfSearchMatches.length + ' · 第' + pdfSearchMatches[pdfSearchCursor].page + '页';
}

window.jumpToEvidence=function(contractId,sourceDocuments,pageStr){
    var c=gc(contractId||cid);if(!c){alert('未找到文件');return;}
    var names=String(sourceDocuments||'').split(/[；;]/).map(function(v){return v.trim();}).filter(Boolean);
    var sourceId=c.id;
    if(names.length&&names[0]!==c.file){
      var supp=(c.supplements||[]).find(function(s){return names.indexOf(s.file)>=0;});
      var linked=associatedDocumentsFor(c).find(function(doc){return !doc.isPrimary&&names.indexOf(doc.name)>=0;});

      else if(supp)sourceId=supp.id;
    }
    cid=c.id;currentPdfSourceId=sourceId;
    var targetPage=parsePageNumber(pageStr);currentPdfPage=targetPage!==null?targetPage:1;
    pdfPaneOpen=true;render();
};

        updatePdfSearchStatus();
        clearPdfSearchHighlights();

    }
    var c = gc(cid);

        return;
    }
    if(reset || q !== pdfSearchQuery) {
        pdfSearchQuery = q;
        pdfSearchMatches = findTextMatches(c.text, q);
        pdfSearchCursor = pdfSearchMatches.length ? 0 : -1;
    } else if(pdfSearchMatches.length) {
        pdfSearchCursor = (pdfSearchCursor + 1) % pdfSearchMatches.length;
    }
    if(pdfSearchMatches.length === 0) {
        updatePdfSearchStatus();

function inferRevenueSupplementType(fileName,text){
  var value=String(fileName||'')+' '+String(text||'').substring(0,1200);
  if(/工作说明书|statement of work|\bSOW\b/i.test(value))return '工作说明书/SOW';
  if(/补充协议|变更协议|合同变更/.test(value))return '补充协议/变更';
  if(/订单|采购单|purchase order|\bPO\b/i.test(value))return '订单';
  if(/信用报告|信用评估|授信|征信/.test(value))return '客户信用资料';
  if(/收款记录|回款记录|银行流水|应收账款账龄/.test(value))return '历史收款资料';
  if(/验收单|验收报告|签收单|交付单/.test(value))return '交付验收资料';
  if(/返利|折扣|退款|可变对价|测算/.test(value))return '价格及测算资料';
  return '其他补充资料';
}
function clearRevenueExtractCache(contractId){
  var prefix='c_'+contractId+'_revenue_workpaper';
  Object.keys(extractCache).forEach(function(key){if(key.indexOf(prefix)===0)delete extractCache[key];});
}

window.uploadRevenueSupplements=async function(contractId,files,requestText){
  var c=gc(contractId);if(!c||!files||!files.length)return;
  if(!c.supplements)c.supplements=[];
  taskRunner.start('upload',c.file+' · 补充资料',files.length);
  addLog(contractId,c.file,'补充资料上传开始',files.length+'份','info');
  var added=0;
  try{
    for(var i=0;i<files.length;i++){
      await taskRunner.checkpoint();
      var file=files[i];
      if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){throw new Error('目前补充资料仅支持PDF：'+file.name);}
      var sid=gid();
      taskRunner.update('解析补充资料 '+(i+1)+'/'+files.length+' · '+file.name,(i+1)+'/'+files.length);
      var result=await processPDF(file,function(msg){taskRunner.update(file.name+' · '+String(msg),(i+1)+'/'+files.length);},sid);
      var supplement={id:sid,file:file.name,docType:inferRevenueSupplementType(file.name,result.text),text:result.text,status:'已解析，待吸收',requestText:requestText||'',t:new Date().toISOString()};
      c.supplements.push(supplement);

function isAmountHeader(h){
  return /金额|税额|价税|借方|贷方|余额|单价|数量/.test(String(h||''));
}
function parseAmountNumber(v){
  if(v===undefined||v===null||v==='')return null;
  if(typeof v==='number'&&isFinite(v))return v;
  var s=String(v).trim();
  if(!s)return null;
  s=s.replace(/[¥￥$€£,\s]/g,'').replace(/人民币|RMB|CNY/gi,'');
  if(!/^-?\d+(\.\d+)?$/.test(s))return null;
  var n=parseFloat(s);
  return isFinite(n)?n:null;
}
function styleExportSheet(ws){
  if(!ws||!ws['!ref'])return ws;
  var range=XLSX.utils.decode_range(ws['!ref']);
  var thin={style:'thin',color:{rgb:'B0B8C4'}};
  var border={top:thin,bottom:thin,left:thin,right:thin};
  var headerFill={patternType:'solid',fgColor:{rgb:'1F4E79'}};
  var headerFont={name:'微软雅黑',sz:11,bold:true,color:{rgb:'FFFFFF'}};
  var bodyFont={name:'微软雅黑',sz:10,color:{rgb:'1F2937'}};
  var altFill={patternType:'solid',fgColor:{rgb:'F2F5F9'}};
  var whiteFill={patternType:'solid',fgColor:{rgb:'FFFFFF'}};
  var amountCols={};
  var cols=[];
  var C,R,addr,cell,header,maxW,len,num,isHeader,isAmt;
  for(C=range.s.c;C<=range.e.c;++C){
    addr=XLSX.utils.encode_cell({r:range.s.r,c:C});
    cell=ws[addr];
    header=cell&&cell.v!=null?String(cell.v):'';
    if(isAmountHeader(header))amountCols[C]=true;
    maxW=Math.max(8,header.length);
    for(R=range.s.r+1;R<=range.e.r;++R){
      cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(cell&&cell.v!=null){len=String(cell.v).length;if(len>maxW)maxW=len;}
    }
    cols.push({wch:Math.min(Math.max(maxW+2,10),48)});
  }
  ws['!cols']=cols;
  ws['!rows']=[{hpt:24}];
  for(R=range.s.r;R<=range.e.r;++R){
    for(C=range.s.c;C<=range.e.c;++C){
      addr=XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr])ws[addr]={t:'s',v:''};
      cell=ws[addr];
      isHeader=R===range.s.r;
      isAmt=!isHeader&&!!amountCols[C];
      if(isAmt){
        num=parseAmountNumber(cell.v);
        if(num!==null){cell.t='n';cell.v=num;delete cell.w;}
      }
      cell.s={
        font:isHeader?headerFont:bodyFont,
        fill:isHeader?headerFill:(R%2===0?altFill:whiteFill),
        border:border,
        alignment:{vertical:'center',horizontal:(isAmt&&cell.t==='n')?'right':'left',wrapText:true}
      };
      if(isAmt&&cell.t==='n')cell.s.numFmt='#,##0.00';
    }
  }
  return ws;
}
function exportToExcel(contractId,allMode,ruleId,allRules,fieldSetId){
if(typeof XLSX==='undefined'){alert('Excel 导出组件未加载，请使用最新版 AudiPick 或检查网络后重试');return;}
var cids=[];
if(allMode&&pid){var cs=Ct.filter(function(x){return x.pid===pid;});cs.forEach(function(c){cids.push(c.id);});}
else if(contractId){cids.push(contractId);}
if(cids.length===0){alert('没有数据可导出');return;}
var sheets=buildExportRows(cids,ruleId||activeRuleId,!!allRules,fieldSetId||activeFieldSetId||null);
var names=Object.keys(sheets);
var total=0;names.forEach(function(n){total+=sheets[n].rows.length;});
if(total===0){alert('没有数据可导出（当前文件尚无提取结果）');return;}
try{
var wb=XLSX.utils.book_new();
names.forEach(function(name){
  var data=sheets[name].rows;
  if(data.length===0)return;
  var safeName=name.substring(0,31).replace(/[\/?*\[\]]/g,'_');
  XLSX.utils.book_append_sheet(wb,styleExportSheet(XLSX.utils.json_to_sheet(data)),safeName);
});
if(wb.SheetNames.length===0){alert('没有数据可导出');return;}
var fname='AudiPick_'+new Date().toISOString().split('T')[0]+'.xlsx';
XLSX.writeFile(wb,fname);
}catch(e){
console.error('export failed',e);
alert('导出失败: '+(e&&e.message?e.message:String(e)));
}
}

function styleRevenueChecklistSheet(ws){

if(!ws||!ws['!ref'])return ws;
ws['!autofilter']={ref:ws['!ref']};
ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
ws['!cols']=[
{wch:6},{wch:28},{wch:24},{wch:18},{wch:10},{wch:12},{wch:48},{wch:16},{wch:42},
{wch:42},{wch:48},{wch:52},{wch:28},{wch:38},{wch:38},{wch:28},{wch:22},{wch:20},{wch:14},{wch:10},
{wch:14},{wch:16},{wch:16},{wch:16},{wch:28}
];
var range=XLSX.utils.decode_range(ws['!ref']);
ws['!rows']=[{hpt:28}];
for(var R=range.s.r+1;R<=range.e.r;R++){
  var lineEstimate=1;
  [[6,42],[8,38],[9,38],[10,42],[11,46],[12,28],[13,34],[14,34]].forEach(function(cfg){
    var longCell=ws[XLSX.utils.encode_cell({r:R,c:cfg[0]})];
    var text=longCell&&longCell.v!=null?String(longCell.v):'';
    lineEstimate=Math.max(lineEstimate,Math.ceil(text.length/cfg[1])+(text.match(/\n/g)||[]).length);
  });
  ws['!rows'][R]={hpt:Math.min(180,Math.max(36,lineEstimate*14))};
  var readinessCell=ws[XLSX.utils.encode_cell({r:R,c:17})];
  if(readinessCell){
    readinessCell.s=readinessCell.s||{};
    if(readinessCell.v==='可直接填入'){
      readinessCell.s.fill={patternType:'solid',fgColor:{rgb:'E2F0D9'}};
      readinessCell.s.font={name:'微软雅黑',sz:10,bold:true,color:{rgb:'375623'}};
    }else if(readinessCell.v==='资料不足'){
      readinessCell.s.fill={patternType:'solid',fgColor:{rgb:'F4CCCC'}};
      readinessCell.s.font={name:'微软雅黑',sz:10,bold:true,color:{rgb:'9C0006'}};
    }else{
      readinessCell.s.fill={patternType:'solid',fgColor:{rgb:'FFF2CC'}};
      readinessCell.s.font={name:'微软雅黑',sz:10,bold:true,color:{rgb:'9C5700'}};
    }
  }
  var statusCell=ws[XLSX.utils.encode_cell({r:R,c:20})];
  if(statusCell&&statusCell.v==='需人工复核'){
    statusCell.s=statusCell.s||{};
    statusCell.s.fill={patternType:'solid',fgColor:{rgb:'FFF2CC'}};
    statusCell.s.font={name:'微软雅黑',sz:10,bold:true,color:{rgb:'9C5700'}};
  }
}
return ws;
}

window.exportRevenueWorkpaperChecklist=function(contractId,fieldSetId){
if(typeof XLSX==='undefined'){alert('Excel 导出组件未加载，请使用最新版 AudiPick');return;}
if(!window.RevenueWorkpaper){alert('收入底稿套用组件未加载，请重启工具后重试');return;}
var c=gc(contractId);if(!c){alert('未找到当前合同');return;}
var fsId=fieldSetId||FieldSet.latestFieldSetId(contractId,'revenue_workpaper');
var items=fsId?FieldSet.gvFieldSet(contractId,'revenue_workpaper',fsId):[];
if(!items.length){alert('当前文件还没有收入底稿套用结果，请先使用“收入合同审阅底稿”模板提取');return;}
var rows=RevenueWorkpaper.buildChecklistRows(c,items);
if(!rows.length){alert('没有可导出的底稿填列建议');return;}
try{
  var wb=XLSX.utils.book_new();
  var introRows=[
    ['项目','内容'],
    ['清单用途','把AI从收入合同中识别的信息对应到V2收入合同审阅底稿主问题，供项目组逐项复核后填列。'],
    ['匹配依据','工作表名称 + 问题编号 + 问题描述；如底稿模板发生变化，以问题描述为主要人工核对依据。'],
    ['主问题分档','“可直接填入”表示合同事实已明确回答；“建议填入，需复核”表示AI已形成初步判断；“资料不足”只用于确实无法形成结论的情况。'],
    ['附表状态','主问题填入状态与附表完成状态分别判断。例如合同明确存在返利时，3.2主问题可直接填“是”，但附表仍可能需要历史数据和估计测算。'],
    ['填写范围','回答列D、意见/回答理由列E、合同条款摘录及支持证据描述列F。'],
    ['重要提示','本清单不会修改原始.xlsm底稿；所有建议回答和会计判断均须由项目组人工复核。'],
    ['参考底稿','【V2】U_GP SWP 合同审阅 202YMMDD XYZ公司_示例底稿.xlsm'],
    ['合同文件',c.file]
  ];
  var intro=styleExportSheet(XLSX.utils.aoa_to_sheet(introRows));
  intro['!cols']=[{wch:16},{wch:100}];
  intro['!rows']=[{hpt:26},{hpt:36},{hpt:36},{hpt:42},{hpt:42},{hpt:30},{hpt:42},{hpt:30},{hpt:30}];
  XLSX.utils.book_append_sheet(wb,intro,'使用说明');
  var checklist=styleRevenueChecklistSheet(XLSX.utils.json_to_sheet(rows));
  XLSX.utils.book_append_sheet(wb,checklist,'底稿填列清单');
  var base=String(c.file||'收入合同').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_').substring(0,60);
  XLSX.writeFile(wb,base+'_收入底稿填列清单_'+new Date().toISOString().split('T')[0]+'.xlsx');
}catch(e){
  console.error('revenue checklist export failed',e);
  alert('底稿填列清单导出失败: '+(e&&e.message?e.message:String(e)));
}
};
