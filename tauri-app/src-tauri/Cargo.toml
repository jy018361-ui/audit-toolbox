[package]
name = "audit-toolbox"
version = "2.0.0-alpha.53"
description = "统一的 Tauri 审计工具箱"
authors = ["Audit Toolbox"]
edition = "2024"

[lib]
name = "audit_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
uuid = { version = "1", features = ["v4"] }
directories = "6"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
calamine = { version = "=0.36.0", features = ["dates"] }
rust_xlsxwriter = { version = "=0.96.0", features = ["constant_memory", "chrono"] }
csv = "1.3"
encoding_rs = "0.8"
walkdir = "2.5"
polars = { version = "=0.54.4", default-features = false, features = ["lazy", "parquet", "rows"] }
# Polars 0.54.4 can enable polars-io's date CSV serializer through the lazy
# planner without forwarding its optional chrono dependency.  Unify that
# feature on the same polars-io crate so clean/manual builds are reproducible.
polars-io = { version = "=0.54.4", default-features = false, features = ["dtype-datetime"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
umya-spreadsheet = "=3.0.1"
pdfplumber = "0.3"
regex = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
